# SPDX-License-Identifier: Apache-2.0
name: BenchTick
main: bench.BenchTick
version: "1.0"
api: ["1.0.0"]
description: Console commands for bedrock-bench
commands:
  gametime:
    description: Prints the server tick counter
    usage: /gametime
    permission: benchtick.use
  positions:
    description: Prints every online player's position
    usage: /positions
    permission: benchtick.use
permissions:
  benchtick.use:
    default: op
