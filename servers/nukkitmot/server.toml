schema = 1
server = "nukkitmot"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "9cb0aba"

# Nukkit-MOT publishes rolling builds from the master branch on its Jenkins, so a version is the 7-character commit of
# one build, pinned by its build number and sha256. Jenkins keeps only the last few builds; keep a copy of the jar and
# pass it with --artifact-dir, where it is checked against the same pin. Not the -Lite jar, which downloads its
# libraries at start. `runtime` names the JDK in servers/runtimes.toml.
[artifacts]
source = "web"

[artifacts.version."9cb0aba"]
commit = "9cb0aba49b8b1ac2e53f151f553e6997be8a03e3"
build = 1592
protocol = 2193
minecraft = "1.26.50"
runtime = "jdk-21.0.12.1"

[artifacts.version."9cb0aba".any]
url = "https://motci.cn/job/Nukkit-MOT/job/master/1592/artifact/target/Nukkit-MOT-SNAPSHOT.jar"
sha256 = "8215ae3fc0a67da249c83e67ec62dade0dc4dc4f9564f4ca793116347152a9b1"
size = 98709014

# Values the harness writes into Nukkit-MOT's config files, one table per override category
# (docs/methodology.md#fairness-and-feature-parity).
#
# The jar ships neither file, so both start empty. Nukkit-MOT adds its own default for every other key and rewrites
# both files on start; `default` gives that built-in value for the keys written here.
[config]

[config.file."server.properties"]
format = "properties"

[config.file."server.properties".harness]
server-port = { value = "{port}", default = "19132", reason = "machine profile port, away from 19132 so a local game cannot collide" }
xbox-auth = { value = "off", default = "on", reason = "the bots log in offline with self-signed identities" }
allow-flight = { value = "on", default = "off", reason = "Nukkit-MOT kicks players it sees hovering, and with no gravity for clients the bots stay at the teleport height" }
"rcon.password" = { value = "", default = "(random, generated on first start)", reason = "no generated secret in the run's archived configs; RCON stays off" }

[config.file."server.properties".parity]
view-distance = { value = "{view_distance}", default = "8", reason = "the same view distance on every server" }
max-players = { value = "{max_players}", default = "50", reason = "room for every bot" }
level-name = { value = "{level_name}", default = "world", reason = "a fixed world folder, checked absent before launch" }
level-seed = { value = "{seed}", default = "", reason = "the same seed on every server; Nukkit-MOT generates its own terrain from it" }
difficulty = { value = "{difficulty_id}", default = "2", reason = "the same difficulty on every server" }
gamemode = { value = "{gamemode_id}", default = "0", reason = "the same game mode on every server" }
auto-save = { value = "on", default = "on", reason = "the world is saved periodically, as on every server" }

[config.file."nukkit-mot.yml"]
format = "yaml"

[config.file."nukkit-mot.yml".harness]
"network-settings.nethernet.enabled" = { value = "false", type = "bool", default = "true", reason = "NetherNet listens on TCP at the server port and on UDP 19132 whatever server-port says; the bots use RakNet" }
"debug-settings.automatic-bug-report" = { value = "false", type = "bool", default = "true", reason = "no error report upload" }
"debug-settings.bstats-metrics" = { value = "false", type = "bool", default = "true", reason = "no usage statistics upload" }
"debug-settings.update-notifications" = { value = "false", type = "bool", default = "true", reason = "no update check when an operator joins" }
"custom-block-settings.auto-download-vanilla-palette" = { value = "false", type = "bool", default = "true", reason = "no download at first start; the palettes are only used with custom blocks" }

[config.file."nukkit-mot.yml".parity]
"performance-settings.auto-tick-rate" = { value = "false", type = "bool", default = "true", reason = "with it, a slow level is ticked only every few server ticks, which the server tick counter does not show" }
"performance-settings.ticks-per-autosave" = { value = "{autosave_ticks}", type = "int", default = "6000", reason = "the same autosave interval on every server" }
"chunk-settings.ticking-radius" = { value = "{tick_distance}", type = "int", default = "3", reason = "the scenario's simulation distance; it only bounds where the capped chunks are picked" }
"player-settings.save-player-data" = { value = "{save_player_data}", type = "bool", default = "true", reason = "player data is saved, as on every server" }
