schema = 1
server = "dragonfly"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "0.11.6"

# Dragonfly builds. Dragonfly is a Go library without binary releases: 'bbench fetch dragonfly@<version>' builds the
# dfbench helper from the Go module in this folder, which links the Dragonfly module pinned here. Its go.mod must
# require the same module version; fetch refuses the build otherwise.
#
# The module is verified twice: Go checks it against go.sum (go_sum below must match), and fetch checks the module zip
# Go downloaded against the sha256 and size of the copy on the Go module proxy.
#
# A build from a commit is tagged with the commit's first seven characters, a release with its version.
[artifacts]
source = "web"

# First release for Minecraft 1.26.60 (protocol 2225), tagged 2026-10-28.
[artifacts.version."0.11.6"]
commit = "51dd9c1d615f17b70bbeef6ab2cbcee0545e66c0"
protocol = 2225

[artifacts.version."0.11.6".any]
name = "dragonfly-v0.11.6.zip"
url = "https://proxy.golang.org/github.com/df-mc/dragonfly/@v/v0.11.6.zip"
sha256 = "6435deb5432d6b781f931719d8d4ac7faddad10d74b46ca437764ab1c1c68b56"
size = 1441748
module = "github.com/df-mc/dragonfly"
module_version = "v0.11.6"
go_sum = "h1:Qu3ikMiQbjpr6KcVa00ecrireCoCzgsVmzizr0mnv5M="
