[Network]
# The bots connect over loopback, and a loopback-only listener never triggers a firewall prompt for the new build.
Address = "127.0.0.1:19672"

[Server]
# Names the benchmark server in the server list.
Name = "bedrock-bench"
# The bots log in offline with self-signed identities.
AuthEnabled = false

[World]
# The world is saved to disk, as on every server.
SaveData = true
# Fixed world folder, checked absent before launch.
Folder = "bench"

[Players]
# Same view distance on every server.
MaximumChunkRadius = 10
# Room for every bot.
MaxCount = 200
# Player data is saved, as on every server.
SaveData = true

# dfbench's own table: settings Dragonfly only exposes through its Go API.
[Bench]
# At debug level Dragonfly logs every packet it does not handle.
LogLevel = "info"
# Dragonfly skips the ticks of an empty world, which would stop the tick counter the probe reads while idle.
IdleTicking = true
# Same simulation distance on every server.
TickRange = 4
# Same difficulty on every server.
Difficulty = "easy"
# A new Dragonfly world puts players in creative, so every server gets the workload's game mode.
GameMode = "survival"
# Same autosave interval on every server, in seconds.
SaveIntervalSeconds = 300
