# Settings the benchmark gives Dragonfly, written into config.toml in the run's fresh server directory.
#
# Keys are dotted paths into the file dfbench reads: Dragonfly's own sections (Network, Server, World, Players,
# Resources) and the [Bench] table dfbench adds for settings Dragonfly only exposes through its Go API. Each key sits in
# the table of its override category (docs/FAIRNESS.md). A key not listed here is not written and keeps the default of
# the pinned build, as printed by 'dfbench -defaults'. When a written value differs from that default, run.json records
# the change with its category and reason; a value equal to the default is written anyway and checked after the run,
# but is not an override. Placeholders in braces come from the scenario ([server] and [world]) and the machine profile
# ([runtime]); each value is converted to the type of the default it replaces.

schema = 1
file = "config.toml"

[harness]
"Network.Address" = { value = "127.0.0.1:{port}", reason = "the bots connect over loopback to the machine profile's port; a loopback-only listener also never triggers a firewall prompt for the newly built binary" }
"Server.Name" = { value = "{server_name}", reason = "names the benchmark server in the server list" }
"Server.AuthEnabled" = { value = false, reason = "the bots log in offline with self-signed identities" }
"Bench.LogLevel" = { value = "info", reason = "at the example server's debug level, Dragonfly logs every packet it does not handle" }
"Bench.IdleTicking" = { value = true, reason = "Dragonfly skips the ticks of a world nobody is in, which stops the tick counter the probe reads during idle; an idle loader keeps the overworld ticking and loads nothing" }

[parity]
"Players.MaximumChunkRadius" = { value = "{view_distance}", reason = "the same view distance on every server" }
"Players.MaxCount" = { value = "{max_players}", reason = "room for every bot, plus rejoins in chaos scenarios" }
"Players.SaveData" = { value = "{save_player_data}", reason = "player data saved as on every server" }
"World.SaveData" = { value = true, reason = "the world saved to disk as on every server" }
"World.Folder" = { value = "{level_name}", reason = "a fixed world folder, checked absent before launch" }
"Bench.TickRange" = { value = "{tick_distance}", reason = "the same simulation distance on every server" }
"Bench.Difficulty" = { value = "{difficulty}", reason = "the same difficulty on every server" }
"Bench.GameMode" = { value = "{gamemode}", reason = "a new Dragonfly world puts players in creative; every server runs the scenario's game mode" }
"Bench.SaveIntervalSeconds" = { value = "{autosave_s}", reason = "the same autosave interval on every server" }
