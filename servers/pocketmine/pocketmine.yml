settings:
  # One async worker per server CPU, since auto counts every CPU of the machine.
  async-workers: {{ run.server_cpu_count }}
memory:
  # The shipped 1024 MB limit stops the server about 23 s into the 100-bot join.
  main-hard-limit: 0
chunk-ticking:
  # Same simulation distance on every server.
  tick-radius: {{ workload.server.tick_distance }}
ticks-per:
  # Same autosave interval on every server.
  autosave: {{ workload.server.autosave_ticks }}
player:
  # Player data is saved, as on every server.
  save-player-data: {{ workload.server.save_player_data | lower }}
auto-report:
  # No crash report upload.
  enabled: false
auto-updater:
  # No update checks during measurement.
  enabled: false
anonymous-statistics:
  # No usage statistics upload.
  enabled: false
