# SPDX-License-Identifier: Apache-2.0
level-settings:
  # Every level ticks every tick, so the tick counter shows a slow level.
  auto-tick-rate: false
chunk-ticking:
  # The workload's simulation distance.
  tick-radius: {{ workload.server.tick_distance }}
ticks-per:
  # The same autosave interval on every server.
  autosave: {{ workload.server.autosave_ticks }}
player:
  # Player data is saved, as on every server.
  save-player-data: {{ workload.server.save_player_data | lower }}
# Only the benchmark level, without the extra level named world.
worlds: {}
