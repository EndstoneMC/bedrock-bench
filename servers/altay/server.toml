schema = 1
server = "altay"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "5.44.7"

# Altay release phars from GitHub, verified against the sha256 GitHub publishes for each release asset.
# `runtime` names the PHP build in servers/runtimes.toml; `protocol` and `minecraft` are what the release
# speaks.
[artifacts]
source = "github"

[artifacts.version."5.44.7"]
commit = "967975c79034bbff5172fb0daaec64d9fe4aa6c3"
protocol = 2193
minecraft = "1.26.50"
runtime = "php-8.2-pm5-524"

[artifacts.version."5.44.7".any]
url = "https://github.com/altayofficial/Altay/releases/download/5.44.7/Altay.phar"
sha256 = "6d2e09fb96f3055dc72cbab43cf063ba1d148f35f55a4b132775cd3ca8f04071"
size = 4498482

# Values the harness writes into Altay's config files, one table per override category
# (docs/methodology.md#fairness-and-feature-parity). The same plan as PocketMine-MP's, plus the transport.
#
# pocketmine.yml starts from the copy the pinned phar ships, so a value equal to the shipped one is written and read
# back but is not an override. server.properties starts empty; Altay adds its own defaults for every other key, and
# `default` gives that built-in value for the keys written here. Placeholders in braces come from the scenario, the
# machine profile and the placement.
[config]

[config.file."server.properties"]
format = "properties"

[config.file."server.properties".harness]
server-port = { value = "{port}", default = "19132", reason = "machine profile port, away from 19132 so a local game cannot collide" }
server-portv6 = { value = "{port_v6}", default = "19133", reason = "machine profile port + 1" }
enable-ipv6 = { value = "off", default = "on", reason = "the bots use IPv4; with IPv6 on, the server also binds 19133 by default" }
xbox-auth = { value = "off", default = "on", reason = "the bots log in offline with self-signed identities" }

[config.file."server.properties".parity]
view-distance = { value = "{view_distance}", default = "16", reason = "the same view distance on every server" }
max-players = { value = "{max_players}", default = "20", reason = "room for every bot" }
level-name = { value = "{level_name}", default = "world", reason = "a fixed world folder, checked absent before launch" }
level-seed = { value = "{seed}", default = "", reason = "the same seed on every server; Altay generates its own terrain from it" }
difficulty = { value = "{difficulty_id}", default = "2", reason = "the same difficulty on every server" }
gamemode = { value = "{gamemode_upper}", default = "SURVIVAL", reason = "the same game mode on every server" }
auto-save = { value = "on", default = "on", reason = "the world is saved periodically, as on every server" }

[config.file."pocketmine.yml"]
format = "yaml"

[config.file."pocketmine.yml".harness]
"network.transport" = { value = "raknet", reason = "the bots connect over RakNet; Altay logs it as deprecated, so the choice is pinned" }
"auto-report.enabled" = { value = "false", type = "bool", reason = "no crash report upload" }
"auto-updater.enabled" = { value = "false", type = "bool", reason = "no update checks during measurement" }
"anonymous-statistics.enabled" = { value = "false", type = "bool", reason = "no usage statistics upload" }

[config.file."pocketmine.yml".parity]
"settings.async-workers" = { value = "{server_cpu_count}", type = "int", reason = "one async worker per server CPU; auto counts every CPU of the machine, not the server's CPU set" }
"chunk-ticking.tick-radius" = { value = "{tick_distance}", type = "int", reason = "the same simulation distance on every server" }
"ticks-per.autosave" = { value = "{autosave_ticks}", type = "int", reason = "the same autosave interval on every server" }
"player.save-player-data" = { value = "{save_player_data}", type = "bool", reason = "player data is saved, as on every server" }

[config.file."pocketmine.yml".rescue]
"memory.main-hard-limit" = { value = "0", type = "int", reason = "PocketMine-MP stops itself about 23 s into the 100-bot join at the shipped 1024 MB limit, and Altay ships the same limit" }
