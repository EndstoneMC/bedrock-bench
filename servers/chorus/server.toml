# SPDX-License-Identifier: Apache-2.0

schema = 1
server = "chorus"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "95ca835"
include = false
reason = "its player list gives the bots decode errors"

# Chorus builds. Chorus has no releases or tags: 'bbench fetch chorus@<version>' builds chorusbench, the Rust program
# in this folder, which links Chorus at the pinned commit. Cargo.toml must name that commit and Cargo.lock must hash to
# `cargo_lock`; fetch refuses the build otherwise. Cargo.lock pins every git dependency by commit and every crate by
# checksum, and the build runs with --locked on the Rust toolchain named in `rust`.
#
# A build from a commit is tagged with the commit's first seven characters.
[artifacts]
source = "github"

# Latest commit on main when Chorus was added (2026-10-12). `cargo_lock` is the sha256 of Cargo.lock with LF line
# endings.
[artifacts.version."95ca835"]
commit = "95ca8355f5961619ff2949b01ef85a5c6f13e492"
repository = "https://github.com/bedrock-crustaceans/chorus"
protocol = 2193
minecraft = "1.26.50"
rust = "1.95.0"
cargo_lock = "c8cb16058a897ab535b54e22da18730b30682defef7bbfa5ee10e85335aa4e3d"

# The source archive of the commit, for reference. The build gets the same commit through Cargo.
[artifacts.version."95ca835".any]
url = "https://github.com/bedrock-crustaceans/chorus/archive/95ca8355f5961619ff2949b01ef85a5c6f13e492.tar.gz"
sha256 = "0a1a1e7e9222977f466c59fa34e31649a734af4bed40d01052b77131763a7168"
size = 541065

# chorus.toml, by override category (.github/CONTRIBUTING.md#servertoml). Unlisted keys keep the defaults
# 'chorusbench -defaults' prints, and `type` overrides the type of the default a value replaces.
[config.file."chorus.toml"]
format = "toml"

[config.file."chorus.toml".harness]
"network.ip" = { value = "127.0.0.1", reason = "the bots connect over loopback; a loopback-only listener never triggers a firewall prompt for the newly built binary" }
"network.port" = { value = "{port}", reason = "machine profile port, away from 19132 so a local game cannot collide" }
"network.transport" = { value = "RakNet", reason = "the bots speak RakNet" }
"server.authentication" = { value = false, reason = "the bots log in offline with self-signed identities" }

[config.file."chorus.toml".parity]
"server.max_players" = { value = "{max_players}", reason = "room for every bot" }
"server.threads" = { value = "{server_cpu_count}", type = "int", reason = "task pools sized to the server CPUs; on Windows auto counts every CPU of the machine, not the server's CPU set" }
"level.name" = { value = "{level_name}", reason = "a fixed world folder, checked absent before launch" }
"level.seed" = { value = "{seed}", reason = "the same seed on every server; Chorus generates its own terrain from it" }
"level.max_view_distance" = { value = "{view_distance}", reason = "the same view distance on every server" }
"level.autosave" = { value = "{autosave_s}s", reason = "the same autosave interval on every server" }
"level.chunk_saving" = { value = "modified", reason = "Chorus's default: only chunks that changed are saved" }
