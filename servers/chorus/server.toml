# SPDX-License-Identifier: Apache-2.0

schema = 1
server = "chorus"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "5c5ffd3"

# Chorus builds. Chorus has no releases or tags: 'bbench fetch chorus@<version>' builds chorusbench, the Rust program
# in this folder, which links Chorus at the pinned commit. Cargo.toml must name that commit and Cargo.lock must hash to
# `cargo_lock`; fetch refuses the build otherwise. Cargo.lock pins every git dependency by commit and every crate by
# checksum, and the build runs with --locked on the Rust toolchain named in `rust`.
#
# A build from a commit is tagged with the commit's first seven characters.
[artifacts]
source = "github"

# Latest commit on main when Chorus was added (2026-10-12). `cargo_lock` is the sha256 of Cargo.lock with LF line
# endings.
[artifacts.version."5c5ffd3"]
commit = "5c5ffd3962dcb1deedef3021b62aa2f3c33e9a6d"
repository = "https://github.com/bedrock-crustaceans/chorus"
protocol = 2193
minecraft = "1.26.50"
rust = "1.95.0"
cargo_lock = "a7fe4a8f6d4d634adaf62df9940478523f93e3643802fdce9df3734d7d2b19ed"

# The source archive of the commit, for reference. The build gets the same commit through Cargo.
[artifacts.version."5c5ffd3".any]
url = "https://github.com/bedrock-crustaceans/chorus/archive/5c5ffd3962dcb1deedef3021b62aa2f3c33e9a6d.tar.gz"
sha256 = "dc811827914e4d37b1d3d557c1291c3f92af0f52625d21e01ef4f62c458db6f1"
size = 539758
