schema = 1
server = "allay"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "0.14.0"

# Allay release jars from GitHub, verified against the sha256 GitHub publishes for each release asset. `commit` is the
# commit the release tag points at; the jar's file name carries its first nine characters. The 0.14 line accepts
# protocols 818 to 1001; the bots use 1001. `runtime` names the JDK in servers/runtimes.toml.
[artifacts]
source = "github"

[artifacts.version."0.14.0"]
commit = "058fef8332cbd40214e1cf992a1fc0a7b9eea3a9"
protocol = 1001
minecraft = "1.26.30"
runtime = "jdk-21.0.12.1"

[artifacts.version."0.14.0".any]
url = "https://github.com/AllayMC/Allay/releases/download/0.14.0/allay-server-0.14.0-058fef833-shaded.jar"
sha256 = "fc944c56be559a1a9df3097b7f7974ea7d644677d7a6c14b2b86d25c070f9c03"
size = 43956861

# Allay is an independent implementation of the game in Java: no Mojang code and no deliberate shortcuts, but its own
# implementation of each system (fidelity V1). It generates only flat and void worlds. Systems it has are `partial`:
# implemented, without evidence of identical behaviour. Links point at the 0.14.0 commit. The rows observed by a
# counter are declared from the source; no bot has joined Allay yet.
[features]

[features.range."0.14"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/registry/loader/WorldGeneratorFactoryRegistryLoader.java#L18-L19", note = "flat and void worlds only" }
"terrain.any_generator" = { class = "absent", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/registry/loader/WorldGeneratorFactoryRegistryLoader.java#L18-L19", note = "the only generators are flat and void" }
"terrain.structures" = { class = "absent", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/registry/loader/WorldGeneratorFactoryRegistryLoader.java#L18-L19" }
"chunks.client_side_generation" = { class = "absent", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "partial", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/ServerSettings.java#L210-L211", note = "implemented behind world-settings.use-sub-chunk-sending-system, off by default and left off: whole columns in LevelChunk packets" }
"entity.mob_spawning" = { class = "absent", evidence = "https://github.com/AllayMC/Allay/tree/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/world", note = "no natural spawner; the doMobSpawning game rule is declared but not read" }
"entity.mob_ai" = { class = "partial", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/entity/type/EntityTypeInitializer.java#L194", note = "chicken, cow, pig, sheep and zombie only" }
"entity.collision_push" = { class = "partial", evidence = "https://github.com/AllayMC/Allay/blob/058fef8332cbd40214e1cf992a1fc0a7b9eea3a9/server/src/main/java/org/allaymc/server/world/physics/AllayEntityPhysicsEngine.java#L258", note = "own physics engine; players are moved by their clients" }
