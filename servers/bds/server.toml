schema = 1
server = "bds"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "1.26.52.3"

# Bedrock Dedicated Server builds, as published by Mojang. Downloading them needs the Minecraft EULA accepted
# (bbench fetch --accept-eula, or BBENCH_ACCEPT_MINECRAFT_EULA=1). Nothing from these archives is ever committed.
#
# Endstone and LeviLamina take their BDS build from this table too, so a BDS-hosted server and its vanilla baseline
# always run the same verified binary.
[artifacts]
source = "mojang"

# Vanilla baseline for endstone@0.11.14, which hosts this build.
[artifacts.version."1.26.52.3"]
protocol = 2193

[artifacts.version."1.26.52.3".windows]
url = "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-1.26.52.3.zip"
sha256 = "2c9b98d07d2504786996f2335980e88bd969b4a77514925e75471a1349995825"
size = 85766941
executables = ["bedrock_server.exe"]
eula = "minecraft"

[artifacts.version."1.26.52.3".linux]
