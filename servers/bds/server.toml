schema = 1
server = "bds"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "1.26.52.3"

# Bedrock Dedicated Server builds, as published by Mojang. Downloading them needs the Minecraft EULA accepted
# (bbench fetch --accept-eula, or BBENCH_ACCEPT_MINECRAFT_EULA=1). Nothing from these archives is ever committed.
#
# Endstone and LeviLamina take their BDS build from this table too, so a BDS-hosted server and its vanilla baseline
# always run the same verified binary.
[artifacts]
source = "mojang"

# Vanilla baseline of the endstone@0.11.14 comparison; endstone@0.11.13 and endstone@0.11.14 host this build.
[artifacts.version."1.26.52.3".windows]
url = "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-1.26.52.3.zip"
sha256 = "2c9b98d07d2504786996f2335980e88bd969b4a77514925e75471a1349995825"
size = 85766941
executables = ["bedrock_server.exe"]
eula = "minecraft"

[artifacts.version."1.26.52.3".linux]
url = "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.52.3.zip"
sha256 = "f6348d84fa714d04ca194f207e89453ca6bba0a1359396475271a52a150471c6"
size = 94927522
executables = ["bedrock_server"]
eula = "minecraft"

# Same-build baseline for levilamina@26.51.6.
[artifacts.version."1.26.51.1".windows]
url = "https://www.minecraft.net/bedrockdedicatedserver/bin-win/bedrock-server-1.26.51.1.zip"
sha256 = "a1c1ebefde3036223234179f7c1eab4b445b4727f0482a0554818c9bcaf8e4a5"
size = 85766110
executables = ["bedrock_server.exe"]
eula = "minecraft"

[artifacts.version."1.26.51.1".linux]
url = "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.51.1.zip"
sha256 = "ad91d3b824e51ea50b5bb601c295cbd8f543a29b14315c2ad89ff27311e2d860"
size = 94926669
executables = ["bedrock_server"]
eula = "minecraft"

# server.properties for every server that hosts BDS, by override category (.github/CONTRIBUTING.md#servertoml).
# max-threads stays at the shipped default and is recorded as a fact.
[config.file."server.properties"]
format = "properties"

[config.file."server.properties".harness]
server-name = { value = "{server_name}", reason = "names the benchmark server in logs" }
online-mode = { value = "false", reason = "the bots log in offline with self-signed identities" }
server-port = { value = "{port}", reason = "machine profile port, away from 19132 so a local game cannot collide" }
server-portv6 = { value = "{port_v6}", reason = "machine profile port + 1" }
transport = { value = "raknet", reason = "the load bot connects over RakNet" }
enable-lan-visibility = { value = "false", reason = "with RakNet, LAN discovery also binds 19132 and 19133, where a local game may listen" }
allow-list = { value = "false", reason = "the bots are not on the allow list" }
emit-server-telemetry = { value = "false", reason = "no telemetry upload during measurement" }

[config.file."server.properties".parity]
view-distance = { value = "{view_distance}", reason = "the same view distance on every server" }
tick-distance = { value = "{tick_distance}", reason = "the same simulation distance on every server" }
max-players = { value = "{max_players}", reason = "room for every bot" }
level-name = { value = "{level_name}", reason = "a fixed world folder, checked absent before launch" }
level-seed = { value = "{seed}", reason = "the same seed, and so the same terrain, on every server" }
gamemode = { value = "{gamemode}", reason = "the same game mode on every server" }
difficulty = { value = "{difficulty}", reason = "the same difficulty on every server" }
client-side-chunk-generation-enabled = { value = "{csg}", reason = "the scenario decides whether clients may generate terrain themselves" }
server-build-radius-ratio = { value = "Disabled", reason = "the server splits each view between itself and the client dynamically, as shipped" }
