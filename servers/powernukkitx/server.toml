schema = 1
server = "powernukkitx"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "nightly.b9b8fd8"

# PowerNukkitX jars from GitHub, verified against the sha256 GitHub publishes for each release asset.
# A release jar reports its version as <version>-SNAPSHOT with the commit it was built from; `commit` is that commit.
# A nightly jar reports nightly-SNAPSHOT with its commit, which reads as the version nightly.<commit>. The nightly tag
# moves to every new build, so its URL serves only the newest jar. Keep a copy under `name` for --artifact-dir.
# `runtime` names the JDK in servers/runtimes.toml.
[artifacts]
source = "github"

[artifacts.version."3.0.5"]
commit = "9813b75a973aa93d3c29c49c85742a0c1beee3de"
protocol = 2193
minecraft = "1.26.50"
runtime = "jdk-21.0.12.1"

