# Seeded stress every adapter can run (docs/WORKLOADS.md): chaos with only the actions all servers support, at normal
# random tick speed. Same seed as chaos, so the shared actions get the same steps. A robustness check; never ranked.
name = "chaos-portable"
description = "spread100 followed by 15 minutes of seeded chaos every server supports, at normal tick speed; never ranked"
extends = "chaos"
exercises = [
    "terrain.vanilla_generator",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
    "commands.vanilla_set",
]

[phases.chaos]
actions = ["churn", "stack", "gamemode", "kill", "kick", "far_tp", "view_disconnect", "weather"]
tickspeed_cycle = []
