# Nukkit (CloudburstMC) is an independent implementation of the game in Java: no Mojang code, no deliberate shortcuts,
# but many vanilla systems are missing or simpler (fidelity V1). Versions are commits, so each range is one commit. The
# rows observed by a counter were confirmed in the legacy cross-server runs: no movement corrections, no locator-bar
# packets, bots keep hovering at the teleport height. Keys without evidence at hand are `unknown`; none of them is
# exercised by a scenario.

schema = 1
server = "nukkit"

[range."b3caad6"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/CloudburstMC/Nukkit/tree/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/level/generator", note = "own Normal generator; terrain differs from BDS for the same seed" }
"terrain.any_generator" = { class = "partial", evidence = "https://github.com/CloudburstMC/Nukkit/tree/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/level/generator" }
"terrain.structures" = { class = "unknown" }
"chunks.client_side_generation" = { class = "absent", evidence = "https://github.com/CloudburstMC/Nukkit/blob/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/Player.java", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "absent", evidence = "https://github.com/CloudburstMC/Nukkit/blob/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/network/protocol/LevelChunkPacket.java", note = "whole columns in LevelChunk packets" }
"entity.mob_spawning" = { class = "unknown" }
"entity.mob_ai" = { class = "unknown" }
"entity.collision_push" = { class = "unknown" }
"entity.item_entities" = { class = "unknown" }
"player.server_authoritative_movement" = { class = "absent", observed_by = "corrections_per_bot_s", note = "no CorrectPlayerMovePrediction packets; hovering is only kicked, and allow-flight is on" }
"player.physics" = { class = "absent", observed_by = "airborne_frac_steady", note = "bots teleported to y=300 keep hovering" }
"player.hunger_damage" = { class = "unknown" }
"player.locator_bar" = { class = "absent", observed_by = "locator_pkts_per_bot_s" }
"block.redstone" = { class = "unknown" }
"block.random_ticks" = { class = "unknown" }
"block.fluids" = { class = "unknown" }
"block.falling" = { class = "unknown" }
"world.lighting" = { class = "unknown" }
"world.dimensions" = { class = "unknown" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/CloudburstMC/Nukkit/blob/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/Server.java", note = "ticks-per.autosave; the first save of a fresh world runs on the main thread" }
"commands.vanilla_set" = { class = "partial", evidence = "https://github.com/CloudburstMC/Nukkit/tree/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/command/defaults", note = "no fill, setblock, querytarget or loot; gamerule only for players in game" }
"net.encryption" = { class = "vanilla", evidence = "https://github.com/CloudburstMC/Nukkit/blob/b3caad67d86be34aeca3937e64e8176f6760a2d4/src/main/java/cn/nukkit/Server.java", note = "not exercised: benchmarks run offline" }
