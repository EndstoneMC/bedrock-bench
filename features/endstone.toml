# Endstone hosts Mojang's BDS binary of the pinned build and adds a plugin API, so gameplay is BDS's own. From 0.11.14
# it also replaces some server paths with faster ones that are meant to behave identically (fidelity V1). Those keys
# cite the changelog entry; the harness checks them through the observed counters and never through Endstone's own
# test suite. Each pinned release has its own range.

schema = 1
server = "endstone"

[range."0.11.13"]
fidelity = "V0"
"terrain.vanilla_generator" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md", note = "bds@1.26.52.3" }
"terrain.any_generator" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"terrain.structures" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"chunks.client_side_generation" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"entity.mob_spawning" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
