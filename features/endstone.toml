"entity.item_entities" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"player.server_authoritative_movement" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md", observed_by = "corrections_per_bot_s" }
"player.physics" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md", observed_by = "airborne_frac_steady" }
"player.hunger_damage" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"player.locator_bar" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md", observed_by = "locator_pkts_per_bot_s" }
"block.redstone" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
