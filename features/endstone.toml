"world.lighting" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"world.dimensions" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/EndstoneMC/endstone/blob/v0.11.13/CHANGELOG.md" }
