"entity.item_entities" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"player.server_authoritative_movement" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", observed_by = "corrections_per_bot_s" }
"player.physics" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", observed_by = "airborne_frac_steady" }
"player.hunger_damage" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"player.locator_bar" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", observed_by = "locator_pkts_per_bot_s" }
"block.redstone" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"block.random_ticks" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"block.fluids" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"block.falling" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"world.lighting" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"world.dimensions" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
