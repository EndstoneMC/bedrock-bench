# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bots:
    name: Bots
    uses: ./.github/workflows/bots.yml

  publish:
    name: Attach bot binaries
    needs: bots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-built-on-linux
          path: ${{ runner.temp }}/build
      - name: Collect the bot binaries, their checksums and the license files
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/build"
          grep -E '^[0-9a-f]{64}  (loadbot|legacy1001)-' SHA256SUMS >"$RUNNER_TEMP/dist/SHA256SUMS"
          awk '{ print $2 }' "$RUNNER_TEMP/dist/SHA256SUMS" | xargs -I{} cp {} "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist"
          sha256sum --check --strict SHA256SUMS
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/NOTICE" .
      - name: Create the release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --clobber
          else
            prerelease=()
            [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
