# Synthetic console lines in LeviLamina's format, one per dialect role (roles as in bds.toml). Every line, continuation
# lines of multi-line output included, starts with `HH:MM:SS.mmm LVL [Logger] `. LeviLamina and the server log with
# three-letter levels; PreLoader logs first and spells its levels out.
# levilamina-session.log is a whole synthetic session in the same format.
adapter = "levilamina"

[[sample]]
role = "ready"
line = '12:00:05.050 IFO [Server] Server started in (5.0s)! For help, type "help" or "?"'

[[sample]]
role = "version"
line = "12:00:00.501 IFO [Server] Version: 1.26.51.1(ProtocolVersion 2193) with LeviLamina-26.51.6"
value = "26.51.6"

[[sample]]
role = "player_in_world"
line = "12:00:13.000 IFO [Server] Player Spawned: a00 xuid: , pfid: "
value = "a00"

[[sample]]
role = "tick"
line = "12:00:10.300 IFO [Server] Gametime is 104"
value = 104

[[sample]]
role = "level"
line = "12:00:00.900 WRN [Server] Content logging to console is disabled."
value = "warn"

[[sample]]
role = "level"
line = "12:00:23.000 FTL [Server] Something went badly wrong"
value = "fatal"

[[sample]]
role = "level"
line = "12:00:05.110 DBG [ExampleMod] Enabled in debug mode"
value = "debug"

[[sample]]
role = "level"
line = "12:00:00.400 INFO [PreLoader] Preloading: LeviLamina <LeviLamina.dll>"
value = "info"

[[sample]]
role = "strip"
line = "12:00:00.460 IFO [LeviLamina] Loading mods..."
value = "Loading mods..."

[[sample]]
role = "strip"
line = '12:00:20.000 IFO [Server]       "dimension" : 0,'
value = '      "dimension" : 0,'

[[sample]]
role = "strip"
line = "12:00:00.901 IFO [Server]"
value = ""

[[sample]]
role = "benign"
line = "12:00:05.050 ERR [Server] ================ TRANSPORT TYPE ERROR  ==================="

[[sample]]
role = "benign"
line = "12:00:05.050 ERR [Server] Your current connection type is not set to NetherNet."

[[sample]]
role = "benign"
line = "12:00:05.050 ERR [Server] ======================================================="

[[sample]]
role = "not_benign"
line = "12:00:22.000 ERR [Server] Unknown command: status. Please check that the command exists and that you have permission to use it."
