# Integration-test scenario for runs against tests/fakes: four bots and every phase scaled down to seconds.
# The fake server sends a full view of 49 chunks (view 4) in under half a second, so settle ends at its minimum.
name = "fake-quick"
description = "four fake bots, phases in seconds; integration tests only"
exercises = ["player.server_authoritative_movement", "player.physics"]
requires = ["player.server_authoritative_movement", "player.physics"]

[bots]
n = 4
stagger_ms = 50
walk = "none"
spawn_timeout_s = 10.0
progress_interval_s = 0.25
stat_interval_s = 0.5
pkt_interval_s = 1.0

[server]
csg = false
view_distance = 4
max_players = 20

[probe]
interval_s = 0.25
max_gap_s = 2.0

[phases.boot]
cap_s = 30.0

[phases.idle]
delay_s = 0.2
duration_s = 1.5

[phases.join]
cap_s = 20.0

[phases.settle]
cap_s = 6.0
min_s = 1.5
rate_window_s = 1.0
eval_interval_s = 0.25
max_data_age_s = 1.0
retp_after_s = 3.0
nudge_after_s = 60.0

[phases.spread]
query_timeout_s = 3.0

[phases.steady]
delay_s = 0.3
duration_s = 3.0

[phases.teardown]
bot_quit_timeout_s = 3.0
stop_timeout_s = 10.0
