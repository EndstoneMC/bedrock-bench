# The config of runs against the fakes: four bots, every phase in seconds, no cooldown and no reruns.
base = "spread"

[bots]
n = 4
stagger_ms = 50
walk = "none"
spawn_timeout_s = 10.0
progress_interval_s = 0.25
stat_interval_s = 0.5
pkt_interval_s = 1.0

[server]
view_distance = 4
max_players = 20

[probe]
interval_s = 0.25
max_gap_s = 2.0

[phases.boot]
cap_s = 30.0

[phases.idle]
delay_s = 0.2
duration_s = 1.5

[phases.join]
cap_s = 20.0

[phases.settle]
cap_s = 6.0
min_s = 1.5
rate_window_s = 1.0
eval_interval_s = 0.25
max_data_age_s = 1.0
retp_after_s = 3.0
nudge_after_s = 60.0

[phases.spread]
query_timeout_s = 3.0

[phases.steady]
delay_s = 0.3
duration_s = 3.0

[phases.teardown]
bot_quit_timeout_s = 3.0
stop_timeout_s = 10.0

[run]
repeats = 1
cooldown_s = 0.0
rerun_invalid = 0
