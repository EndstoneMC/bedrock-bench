# Figures published in Endstone's BENCHMARK.md for 0.11.14, checked with:
#   bbench report runs/endstone-0.11.14 --claims endstone-0.11.14
# Expression syntax: src/bedrock_bench/report/claims.py. Known differences from the published runs:
# docs/REPRODUCING-endstone-0.11.14.md.
schema = 1
matrix = "endstone-0.11.14"

[[claim]]
id = "endstone-0.11.14-steady-tps"
text = "Endstone 0.11.14 holds 20 TPS with 100 spread players"
scenario = "spread100"
expr = "median('endstone-0.11.14', 'tps_window_steady') >= 19.8"
source = "https://github.com/EndstoneMC/endstone/blob/v0.11.14/BENCHMARK.md"

[[claim]]
id = "endstone-0.11.14-vs-vanilla-tps"
text = "Endstone 0.11.14 ticks at least 1.8 times as fast as vanilla BDS 1.26.52.3"
scenario = "spread100"
expr = "ratio('endstone-0.11.14', 'bds-1.26.52.3', 'tps_window_steady') >= 1.8"
# A machine fast enough to run vanilla at full speed cannot show the ratio.
inconclusive_if = "median('bds-1.26.52.3', 'tps_window_steady') >= 19.5"
source = "https://github.com/EndstoneMC/endstone/blob/v0.11.14/BENCHMARK.md"

[[claim]]
id = "endstone-0.11.14-tick-cpu"
text = "Endstone 0.11.14 spends 42.9 ms of tick-thread CPU per tick, within 15%"
scenario = "spread100"
# Absolute CPU time only holds on the machine that produced the figure.
machine = "reference"
expr = "abs(median('endstone-0.11.14', 'tick_cpu_ms_per_tick_steady') / 42.9 - 1) <= 0.15"
source = "https://github.com/EndstoneMC/endstone/blob/v0.11.14/BENCHMARK.md"
