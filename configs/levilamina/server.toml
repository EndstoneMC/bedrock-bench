"block.redstone" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"block.random_ticks" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"block.fluids" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
