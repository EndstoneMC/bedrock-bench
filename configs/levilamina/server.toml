schema = 1
server = "levilamina"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "26.51.6"

# LeviLamina releases for Windows and the packages each one installs, all GitHub release assets. The BDS build comes
# from configs/bds/server.toml, so a LeviLamina arm and its vanilla baseline run the same verified BDS zip.
#
# A version table names the BDS build the release depends on and its allocator:
#
#   bds        the BDS build in LeviLamina's tooth.json dependencies; fetched from configs/bds/server.toml
#   allocator  the allocator LeviLamina installs in the server; it is linked into LeviLamina.dll, so it is declared
#
# One sub-table per package (windows-<package>) pins its asset and says where its files go, as the package's own
# tooth.json places them:
#
#   release    the package's own version (dependency versions as resolved for this LeviLamina release)
#   place      archive path -> server path; a path ending in "/" copies a directory
#   eula       "levimc": covered by the LeviMC closed-source EULA (PreLoader, PeEditor); fetch needs --accept-eula
#
# The translations package (levilamina-loc) is not installed; LeviLamina's messages are then in English, their source
# language.
[artifacts]
source = "github"

[artifacts.version."26.51.6"]
bds = "1.26.51.1"
allocator = "mimalloc"

[artifacts.version."26.51.6".windows-levilamina]
url = "https://github.com/LiteLDev/LeviLamina/releases/download/v26.51.6/levilamina-v26.51.6-server-release-windows-x64.zip"
sha256 = "d2277ac4ec042e3498f00160ce1aa0e2dcec23f2b9a902925ac9b27a3f0feb40"
size = 11585118
release = "26.51.6"
place = { "LeviLamina/" = "plugins/LeviLamina/" }

[artifacts.version."26.51.6".windows-preloader]
url = "https://github.com/LiteLDev/PreLoader/releases/download/v1.16.3/preloader-v1.16.3-windows-x64.zip"
sha256 = "31dc9419d4a8c1c382d6c2629243757a28141c878b636d17b92b1b2fd0c3af1a"
size = 4167010
release = "1.16.3"
eula = "levimc"
place = { "bin/PreLoader.dll" = "PreLoader.dll" }

[artifacts.version."26.51.6".windows-peeditor]
url = "https://github.com/LiteLDev/PeEditor/releases/download/v3.9.2/peeditor-windows-x64.zip"
sha256 = "cfeba1e9c40fc65a1310853d5cd3d5431d7bc3855c68e23b3d9c7a26f1fe42c2"
size = 1453932
release = "3.9.2"
eula = "levimc"
place = { "PeEditor.exe" = "PeEditor.exe" }

[artifacts.version."26.51.6".windows-crashlogger]
url = "https://github.com/LiteLDev/CrashLogger/releases/download/v1.3.3/CrashLogger-windows-x64.zip"
sha256 = "ade3fc37affbc187020fd9ecb31883a70ab1f3f8238e447a43174343deb33156"
size = 828867
release = "1.3.3"
place = { "CrashLogger.exe" = "plugins/LeviLamina/CrashLogger.exe" }

[artifacts.version."26.51.6".windows-runtime-data]
url = "https://github.com/LiteLDev/bedrock-runtime-data/releases/download/v26.51.1-server.7/bedrock-runtime-data-v26.51.1-server.7-windows-x64.zip"
sha256 = "44e548f693b2eb1bd5ccd8b56169cdbf2b9f01e7d1833717c6351bd8f7a2e385"
size = 30122614
release = "26.51.1-server.7"
place = { "bedrock_runtime_data" = "bedrock_runtime_data" }

# LeviLamina loads into Mojang's BDS binary of the pinned build, so gameplay is BDS's own. It also swaps the server's
# memory allocator for mimalloc and drops some malformed packets, which keeps behaviour for well-formed clients the same
# (fidelity V1).
[features]

[features.range."26.51"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", note = "bds@1.26.51.1" }
"terrain.any_generator" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"terrain.structures" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"chunks.client_side_generation" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6", note = "oversized requests are dropped (vulnerabilityFixes.subChunkRequest); the bot's requests are far below the limit" }
"entity.mob_spawning" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
"entity.mob_ai" = { class = "vanilla", evidence = "https://github.com/LiteLDev/LeviLamina/releases/tag/v26.51.6" }
