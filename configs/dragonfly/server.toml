schema = 1
server = "dragonfly"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "1793369"

# Dragonfly builds. Dragonfly is a Go library without binary releases: 'bbench fetch dragonfly@<version>' builds the
# dfbench helper from the Go module in this folder, which links the Dragonfly module pinned here. Its go.mod must
# require the same module version; fetch refuses the build otherwise.
#
# The module is verified twice: Go checks it against go.sum (go_sum below must match), and fetch checks the module zip
# Go downloaded against the sha256 and size of the copy on the Go module proxy.
#
# A build from a commit is tagged with the commit's first seven characters, a release with its version.
[artifacts]
source = "web"

# Latest commit on master when the cross-server runs were set up (2026-09-20).
[artifacts.version."1793369"]
commit = "1793369709ceed934675d69e86ff6c828e4216c8"

[artifacts.version."1793369".any]
name = "dragonfly-v0.11.6-0.20260920163020-1793369709ce.zip"
url = "https://proxy.golang.org/github.com/df-mc/dragonfly/@v/v0.11.6-0.20260920163020-1793369709ce.zip"
sha256 = "2168b139b09a7a45f9998c748bf9d929053efb1a5e3af14910c5f0c9e7fbae6e"
size = 1450678
module = "github.com/df-mc/dragonfly"
module_version = "v0.11.6-0.20260920163020-1793369709ce"
go_sum = "h1:/ciP7huZdFVByDcVz+ORyCqMgDbzyprRYDXCv3mzu94="

# Dragonfly: an independent Bedrock server written in Go. It shares no code with BDS. Features it implements are
# declared partial unless their behaviour is known to match vanilla; source links point at the pinned commit.
#
# Fidelity V1: Dragonfly does not skip work it implements to go faster, but it implements much less than vanilla. The
# rows below say what is missing; observed counters check the ones a spread run can see.
[features]

[features.range."1793369"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/conf.go#L394-L407", note = "flat worlds only" }
"terrain.any_generator" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/conf.go#L394-L407", note = "the only generator is flat" }
"terrain.structures" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/conf.go#L394-L407" }
"chunks.client_side_generation" = { class = "absent", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "vanilla", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/session/handler_sub_chunk_request.go" }
"entity.mob_spawning" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/tree/1793369709ceed934675d69e86ff6c828e4216c8/server/entity", note = "no mobs" }
"entity.mob_ai" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/tree/1793369709ceed934675d69e86ff6c828e4216c8/server/entity", note = "no mobs" }
"entity.collision_push" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/entity/movement.go#L118-L122" }
"entity.item_entities" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/entity/item_behaviour.go#L117-L152", note = "items merge and despawn; independent implementation" }
"player.server_authoritative_movement" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/session/handler_player_auth_input.go#L28-L67", observed_by = "corrections_per_bot_s", note = "client positions are accepted as sent" }
"player.physics" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/session/handler_player_auth_input.go#L28-L67", observed_by = "airborne_frac_steady", note = "bots teleported to y=300 keep hovering" }
"player.hunger_damage" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/player/player.go#L558-L586", note = "hunger and damage exist; fall damage follows client-reported movement" }
"player.locator_bar" = { class = "absent", observed_by = "locator_pkts_per_bot_s" }
"block.redstone" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/world/redstone.go" }
"block.random_ticks" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/world/tick.go#L127", note = "fixed rate set at world creation, no randomtickspeed game rule" }
"block.fluids" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/block/liquid.go", note = "independent implementation" }
"block.falling" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/block/sand.go#L29-L31", note = "independent implementation" }
"world.lighting" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/world/chunk/light.go", note = "independent implementation" }
"world.dimensions" = { class = "partial", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/conf.go#L394-L407", note = "Nether and End exist as flat worlds" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/world/conf.go#L102-L104", note = "interval aligned with BDS through Bench.SaveIntervalSeconds" }
"commands.vanilla_set" = { class = "absent", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/cmd/doc.go", note = "a command framework without vanilla commands; dfbench adds the console commands the harness sends" }
"net.encryption" = { class = "vanilla", evidence = "https://github.com/df-mc/dragonfly/blob/1793369709ceed934675d69e86ff6c828e4216c8/server/conf.go#L255-L257", note = "not exercised: benchmarks run offline" }

# config.toml for dfbench, by override category (.github/CONTRIBUTING.md#servertoml). Unlisted keys keep the
# defaults 'dfbench -defaults' prints; [Bench] holds settings Dragonfly only exposes through its Go API.
[config.file."config.toml"]
format = "toml"

[config.file."config.toml".harness]
"Network.Address" = { value = "127.0.0.1:{port}", reason = "the bots connect over loopback to the machine profile's port; a loopback-only listener also never triggers a firewall prompt for the newly built binary" }
"Server.Name" = { value = "{server_name}", reason = "names the benchmark server in the server list" }
"Server.AuthEnabled" = { value = false, reason = "the bots log in offline with self-signed identities" }
"Bench.LogLevel" = { value = "info", reason = "at the example server's debug level, Dragonfly logs every packet it does not handle" }
"Bench.IdleTicking" = { value = true, reason = "Dragonfly skips the ticks of a world nobody is in, which stops the tick counter the probe reads during idle; an idle loader keeps the overworld ticking and loads nothing" }

[config.file."config.toml".parity]
"Players.MaximumChunkRadius" = { value = "{view_distance}", reason = "the same view distance on every server" }
"Players.MaxCount" = { value = "{max_players}", reason = "room for every bot" }
"Players.SaveData" = { value = "{save_player_data}", reason = "player data saved as on every server" }
"World.SaveData" = { value = true, reason = "the world saved to disk as on every server" }
"World.Folder" = { value = "{level_name}", reason = "a fixed world folder, checked absent before launch" }
"Bench.TickRange" = { value = "{tick_distance}", reason = "the same simulation distance on every server" }
"Bench.Difficulty" = { value = "{difficulty}", reason = "the same difficulty on every server" }
"Bench.GameMode" = { value = "{gamemode}", reason = "a new Dragonfly world puts players in creative; every server runs the scenario's game mode" }
"Bench.SaveIntervalSeconds" = { value = "{autosave_s}", reason = "the same autosave interval on every server" }
