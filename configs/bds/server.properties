# Names the benchmark server in logs.
server-name=bedrock-bench
# The bots log in offline with self-signed identities.
online-mode=false
# Port from the machine profile, away from 19132 so a local game cannot collide.
server-port={{ run.port }}
# Machine profile port + 1.
server-portv6={{ run.port_v6 }}
# The bots connect over RakNet.
transport=raknet
# With RakNet, LAN discovery also binds 19132 and 19133, where a local game may listen.
enable-lan-visibility=false
# The bots are not on the allow list.
allow-list=false
# No telemetry upload during measurement.
emit-server-telemetry=false
# Same view distance on every server.
view-distance={{ workload.server.view_distance }}
# Same simulation distance on every server.
tick-distance={{ workload.server.tick_distance }}
# Room for every bot.
max-players={{ workload.server.max_players }}
# Fixed world folder, checked absent before launch.
level-name={{ workload.world.level_name }}
# Same seed, and so the same terrain, on every server.
level-seed={{ workload.world.seed }}
# Same game mode on every server.
gamemode={{ workload.server.gamemode }}
# Same difficulty on every server.
difficulty={{ workload.server.difficulty }}
# Clients do not generate terrain, so the server generates and sends every chunk.
client-side-chunk-generation-enabled={{ workload.server.csg | lower }}
# The server splits each view between itself and the client on its own, as shipped.
server-build-radius-ratio=Disabled
