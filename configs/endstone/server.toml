schema = 1
server = "endstone"

# What `bbench run` measures when it is given no tag.
[benchmark]
version = "0.11.14"
bds = "1.26.52.3"
python = "3.13"

# Endstone releases from PyPI. One table per release says which BDS build it hosts; one sub-table per platform and
# CPython version pins the wheel. The wheel's dependencies are locked with hashes in requirements-<version>.txt next to
# this file.
#
#   bds             BDS build the release supports; fetched from configs/bds/server.toml
#   python          CPython used when the arm does not name one
#   version_marker  what the launcher expects in the server's version.txt (<minor>.<patch> of the BDS build)
#   known_issues    defects of the release that change measurements; recorded in each run's facts
[artifacts]
source = "pypi"

[artifacts.version."0.11.13"]
bds = "1.26.52.3"
python = "3.13"
version_marker = "26.52"
known_issues = [
    { platforms = ["windows"], text = "The hidden DevTools window keeps a CPU core busy (fixed in 0.11.14).", source = "https://github.com/EndstoneMC/endstone/blob/v0.11.14/CHANGELOG.md" },
    { platforms = ["windows", "linux"], text = "The scheduler's idle threads use CPU (fixed in 0.11.14).", source = "https://github.com/EndstoneMC/endstone/blob/v0.11.14/CHANGELOG.md" },
]

