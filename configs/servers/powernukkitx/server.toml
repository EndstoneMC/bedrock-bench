schema = 1
server = "powernukkitx"

# PowerNukkitX jars from GitHub, verified against the sha256 GitHub publishes for each release asset.
# A release jar reports its version as <version>-SNAPSHOT with the commit it was built from; `commit` is that commit.
# A nightly jar reports nightly-SNAPSHOT with its commit, which reads as the version nightly.<commit>. The nightly tag
# moves to every new build, so its URL serves only the newest jar. Keep a copy under `name` for --artifact-dir.
# `runtime` names the JDK in configs/servers/runtimes.toml.
[artifacts]
source = "github"

[artifacts.version."3.0.5"]
commit = "9813b75a973aa93d3c29c49c85742a0c1beee3de"
protocol = 2193
minecraft = "1.26.50"
runtime = "jdk-21.0.12.1"

[artifacts.version."3.0.5".any]
url = "https://github.com/PowerNukkitX/PowerNukkitX/releases/download/3.0.5/powernukkitx.jar"
sha256 = "bc3c54236256c8e3bf8573ecf090e3853785c7622891d7d28d780a398fc1de60"
size = 86100503

[artifacts.version."nightly.86f70bc"]
commit = "86f70bc341849788007b751728670f7e9a7c1e72"
protocol = 2193
minecraft = "1.26.50"
runtime = "jdk-25.0.4.1"

[artifacts.version."nightly.86f70bc".any]
url = "https://github.com/PowerNukkitX/PowerNukkitX/releases/download/nightly/powernukkitx.jar"
name = "powernukkitx-nightly-86f70bc.jar"
sha256 = "2eb036d350860f2cff8962b94beeeee1e4794e6bb279ed1e55ba74315bcf3843"
size = 95174280

# PowerNukkitX is a Nukkit fork that reimplements much more of vanilla gameplay in Java: mobs with AI, redstone,
# fluids, dimensions. No Mojang code and no deliberate shortcuts, but its own implementation (fidelity V1). Systems it
# has are `partial`: implemented, without evidence of identical behaviour. The rows observed by a counter were
# confirmed in the legacy cross-server runs: no movement corrections, no locator-bar packets, bots keep hovering at the
# teleport height. The nightly range covers every nightly.<commit> pin. Its rows were checked at 86f70bc, the observed
# ones with four bots.
[features]

[features.range."3.0"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/PowerNukkitX/PowerNukkitX/tree/9813b75a973aa93d3c29c49c85742a0c1beee3de/src/main/java/org/powernukkitx/level/generator", note = "own generator; terrain differs from BDS for the same seed" }
