# SPDX-License-Identifier: Apache-2.0
# Delivery without generation: each server loads a world template built by its own pipeline
# ('bbench prepare-world <server@version> --scenario spread100-pregen'), validated at 99% coverage of every cell.
# Generation happens before the run, so the terrain generator is not part of the measured work.
name = "spread100-pregen"
description = "spread100 on a pre-generated world template; measures delivery without generation"
extends = "spread100"
exercises = [
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]
requires = [
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]

[world]
source = "template"
template_radius = 12
min_coverage = 0.99
