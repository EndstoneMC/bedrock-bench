# SPDX-License-Identifier: Apache-2.0
# 'bbench smoke <server@version>': four bots and short phases that check an adapter end to end.
# The run must be ok, every command the harness sends must be accepted, and bots must see movement corrections where
# the feature file declares server-authoritative movement.
name = "smoke"
description = "4 bots, view distance 4, short phases; checks an adapter end to end"
exercises = [
    "terrain.vanilla_generator",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]

[bots]
n = 4
prefix = "a"
stagger_ms = 300
spawn_timeout_s = 60.0
progress_interval_s = 5.0
stat_interval_s = 10.0
pkt_interval_s = 10.0

[server]
csg = false
view_distance = 4

[phases.idle]
delay_s = 5.0
duration_s = 10.0

[phases.join]
cap_s = 120.0

[phases.settle]
min_s = 30.0
cap_s = 60.0
rate_window_s = 20.0
nudge_after_s = 30.0

[phases.steady]
delay_s = 5.0
duration_s = 20.0

[phases.teardown]
stop_timeout_s = 60.0
