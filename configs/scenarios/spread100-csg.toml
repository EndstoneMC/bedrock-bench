# SPDX-License-Identifier: Apache-2.0
# spread100 with client-side generation on, for BDS-hosted servers only; never in a cross-server table. The bots
# announce support for it.
name = "spread100-csg"
description = "spread100 with client-side generation on; BDS-hosted servers only, never cross-server"
extends = "spread100"
exercises = [
    "terrain.vanilla_generator",
    "chunks.client_side_generation",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]
requires = [
    "terrain.vanilla_generator",
    "chunks.client_side_generation",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]

[server]
csg = true
