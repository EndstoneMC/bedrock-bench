# SPDX-License-Identifier: Apache-2.0
# The headline workload for every server, Endstone included (docs/methodology.md#workload).
# 100 bots, one per grid cell, client-side generation off: every server generates and sends the full view disc.
name = "spread100"
description = "100 spread bots, view distance 10, client-side generation off; the cross-server headline"
exercises = [
    "terrain.vanilla_generator",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]
requires = [
    "terrain.vanilla_generator",
    "chunks.subchunk_requests",
    "player.server_authoritative_movement",
    "player.physics",
    "player.locator_bar",
    "world.autosave",
]

[bots]
n = 100
prefix = "a"
stagger_ms = 300
radius = 16
walk = "circle"
spawn_timeout_s = 180.0
join_retries = 0
progress_interval_s = 5.0
stat_interval_s = 10.0
pkt_interval_s = 30.0  # three packet-mix intervals fit inside the steady window

[grid]
columns = 11
spacing = 640
origin = 1280
y = 300.0

[world]
seed = 20261010
level_name = "bench"
source = "fresh"

[server]
csg = false
view_distance = 10
tick_distance = 4
difficulty = "easy"
gamemode = "survival"
max_players = 200
autosave_ticks = 6000
save_player_data = true

[probe]
interval_s = 5.0
max_gap_s = 15.0
lagging_p99_ms = 1000.0

[phases.boot]
cap_s = 600.0

[phases.idle]
delay_s = 10.0
duration_s = 20.0

[phases.join]
cap_s = 300.0
pre_bots_s = 0.0

[phases.settle]
min_s = 300.0
cap_s = 900.0
rate_per_bot = 0.1
rate_window_s = 60.0

[phases.steady]
delay_s = 15.0
duration_s = 90.0
