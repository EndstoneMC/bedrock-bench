# SPDX-License-Identifier: Apache-2.0
# The machine profile's port, away from 19132 so a local game cannot collide.
server-port={{ run.port }}
# The bots log in offline with self-signed identities.
xbox-auth=off
# Nukkit kicks players it sees hovering, and the bots stay at the teleport height.
allow-flight=on
# No generated secret in the run's saved configs, and RCON stays off.
rcon.password=
# The same view distance on every server.
view-distance={{ workload.server.view_distance }}
# Room for every bot.
max-players={{ workload.server.max_players }}
# A fixed world folder, checked absent before launch.
level-name={{ workload.world.level_name }}
# The same seed on every server.
level-seed={{ workload.world.seed }}
# The same difficulty on every server.
difficulty={{ workload.server.difficulty_id }}
# The same game mode on every server.
gamemode={{ workload.server.gamemode_id }}
# The world is saved periodically, as on every server.
auto-save=on
