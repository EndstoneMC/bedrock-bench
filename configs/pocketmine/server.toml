# SPDX-License-Identifier: Apache-2.0

schema = 1
server = "pocketmine"

# PocketMine-MP release phars from GitHub, verified against the sha256 GitHub publishes for each release asset.
# `runtime` names the PHP build in configs/runtimes.toml; `protocol` and `minecraft` are what the release
# speaks.
[artifacts]
source = "github"

[artifacts.version."5.44.3"]
commit = "51c8777b46683d24cfd29fe650205c22c262b678"
protocol = 1001
minecraft = "1.26.30"
runtime = "php-8.2-pm5-524"

[artifacts.version."5.44.3".any]
url = "https://github.com/pmmp/PocketMine-MP/releases/download/5.44.3/PocketMine-MP.phar"
sha256 = "d8b4d87a64124d83659f629c87d6a8e0e142192f6c719fe4684272ff44105539"
size = 3354057

# PocketMine-MP is an independent implementation of the game in PHP: no Mojang code, no deliberate shortcuts, but many
# vanilla systems are missing or simpler (fidelity V1). The rows observed by a counter were confirmed in the legacy
# cross-server runs: no movement corrections, no locator-bar packets, bots keep hovering at the teleport height.
# Keys without evidence at hand are `unknown`; none of them is exercised by a scenario.
[features]

[features.range."5.44"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/pmmp/PocketMine-MP/tree/5.44.3/src/world/generator", note = "own Normal generator; terrain differs from BDS for the same seed" }
"terrain.any_generator" = { class = "partial", evidence = "https://github.com/pmmp/PocketMine-MP/tree/5.44.3/src/world/generator", note = "noise terrain with ores and trees" }
"terrain.structures" = { class = "absent", evidence = "https://github.com/pmmp/PocketMine-MP/tree/5.44.3/src/world/generator" }
"chunks.client_side_generation" = { class = "absent", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/src/network/mcpe/ChunkRequestTask.php", observed_by = "csg_effective" }
"chunks.subchunk_requests" = { class = "absent", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/src/network/mcpe/ChunkRequestTask.php", note = "whole columns in LevelChunk packets" }
"entity.mob_spawning" = { class = "unknown" }
"entity.mob_ai" = { class = "unknown" }
"entity.collision_push" = { class = "unknown" }
"entity.item_entities" = { class = "unknown" }
"player.server_authoritative_movement" = { class = "absent", observed_by = "corrections_per_bot_s", note = "no CorrectPlayerMovePrediction packets" }
"player.physics" = { class = "absent", observed_by = "airborne_frac_steady", note = "bots teleported to y=300 keep hovering" }
"player.hunger_damage" = { class = "partial", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/src/entity/HungerManager.php" }
"player.locator_bar" = { class = "absent", observed_by = "locator_pkts_per_bot_s" }
"block.redstone" = { class = "unknown" }
"block.random_ticks" = { class = "partial", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/resources/pocketmine.yml", note = "chunk-ticking.blocks-per-subchunk-per-tick" }
"block.fluids" = { class = "unknown" }
"block.falling" = { class = "unknown" }
"world.lighting" = { class = "unknown" }
"world.dimensions" = { class = "unknown" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/resources/pocketmine.yml", note = "ticks-per.autosave" }
"commands.vanilla_set" = { class = "partial", evidence = "https://github.com/pmmp/PocketMine-MP/tree/5.44.3/src/command/defaults", note = "no gamerule, fill, setblock, summon or querytarget" }
"net.encryption" = { class = "vanilla", evidence = "https://github.com/pmmp/PocketMine-MP/blob/5.44.3/src/network/mcpe/encryption/EncryptionContext.php", note = "not exercised: benchmarks run offline" }

# Values the harness writes into PocketMine-MP's config files, one table per override category
# (docs/methodology.md#fairness-and-feature-parity).
#
# pocketmine.yml starts from the copy the pinned phar ships, so a value equal to the shipped one is written and read
# back but is not an override. server.properties starts empty; PocketMine-MP adds its own defaults for every other
# key, and `default` gives that built-in value for the keys written here. Placeholders in braces come from the
# scenario, the machine profile and the placement.
[config]

[config.file."server.properties"]
format = "properties"

[config.file."server.properties".harness]
server-port = { value = "{port}", default = "19132", reason = "machine profile port, away from 19132 so a local game cannot collide" }
server-portv6 = { value = "{port_v6}", default = "19133", reason = "machine profile port + 1" }
enable-ipv6 = { value = "off", default = "on", reason = "the bots use IPv4; with IPv6 on, the server also binds 19133 by default" }
xbox-auth = { value = "off", default = "on", reason = "the bots log in offline with self-signed identities" }

[config.file."server.properties".parity]
view-distance = { value = "{view_distance}", default = "16", reason = "the same view distance on every server" }
max-players = { value = "{max_players}", default = "20", reason = "room for every bot" }
level-name = { value = "{level_name}", default = "world", reason = "a fixed world folder, checked absent before launch" }
level-seed = { value = "{seed}", default = "", reason = "the same seed on every server; PocketMine-MP generates its own terrain from it" }
difficulty = { value = "{difficulty_id}", default = "2", reason = "the same difficulty on every server" }
gamemode = { value = "{gamemode_upper}", default = "SURVIVAL", reason = "the same game mode on every server" }
auto-save = { value = "on", default = "on", reason = "the world is saved periodically, as on every server" }

[config.file."pocketmine.yml"]
format = "yaml"

[config.file."pocketmine.yml".harness]
"auto-report.enabled" = { value = "false", type = "bool", reason = "no crash report upload" }
"auto-updater.enabled" = { value = "false", type = "bool", reason = "no update checks during measurement" }
"anonymous-statistics.enabled" = { value = "false", type = "bool", reason = "no usage statistics upload" }

[config.file."pocketmine.yml".parity]
"settings.async-workers" = { value = "{server_cpu_count}", type = "int", reason = "one async worker per server CPU; auto counts every CPU of the machine, not the server's CPU set" }
"chunk-ticking.tick-radius" = { value = "{tick_distance}", type = "int", reason = "the same simulation distance on every server" }
"ticks-per.autosave" = { value = "{autosave_ticks}", type = "int", reason = "the same autosave interval on every server" }
"player.save-player-data" = { value = "{save_player_data}", type = "bool", reason = "player data is saved, as on every server" }

[config.file."pocketmine.yml".rescue]
"memory.main-hard-limit" = { value = "0", type = "int", reason = "with the shipped 1024 MB limit the server stops itself about 23 s into the 100-bot join" }
