schema = 1
server = "nukkitmot"

# Nukkit-MOT publishes rolling builds from the master branch on its Jenkins, so a version is the 7-character commit of
# one build, pinned by its build number and sha256. Jenkins keeps only the last few builds; keep a copy of the jar and
# pass it with --artifact-dir, where it is checked against the same pin. Not the -Lite jar, which downloads its
# libraries at start. `runtime` names the JDK in configs/runtimes.toml.
[artifacts]
source = "web"

[artifacts.version."9cb0aba"]
commit = "9cb0aba49b8b1ac2e53f151f553e6997be8a03e3"
build = 1592
protocol = 2193
minecraft = "1.26.50"
runtime = "jdk-21.0.12.1"

[artifacts.version."9cb0aba".any]
url = "https://motci.cn/job/Nukkit-MOT/job/master/1592/artifact/target/Nukkit-MOT-SNAPSHOT.jar"
sha256 = "8215ae3fc0a67da249c83e67ec62dade0dc4dc4f9564f4ca793116347152a9b1"
size = 98709014

# Nukkit-MOT is a multi-version fork of Nukkit in Java: no Mojang code, its own implementation of most vanilla systems
# (fidelity V1). Systems it has are `partial`: implemented, without evidence of identical behaviour. The rows observed
# by a counter were seen with four bots on the pinned build: no movement corrections, no locator-bar packets, whole
# chunk columns only, and bots keep hovering at the teleport height.
[features]

[features.range."9cb0aba"]
fidelity = "V1"
"terrain.vanilla_generator" = { class = "absent", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/level/generator/Normal.java", note = "own Normal generator; terrain differs from BDS for the same seed" }
"terrain.any_generator" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/tree/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/level/generator" }
"terrain.structures" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/level/generator/Normal.java", note = "own populators for villages, strongholds, temples and other structures" }
"chunks.client_side_generation" = { class = "absent", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/network/protocol/StartGamePacket.java", observed_by = "csg_effective", note = "the start game flag is never set" }
"chunks.subchunk_requests" = { class = "absent", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/network/protocol/LevelChunkPacket.java", note = "whole columns in LevelChunk packets; sub-chunk requests are decoded but not handled" }
"entity.mob_spawning" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/utils/SpawnerTask.java", note = "entity-settings.auto-spawn-task" }
"entity.mob_ai" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/tree/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/entity/mob", note = "mobs more than 80 blocks from every player update once per second" }
"entity.collision_push" = { class = "unknown" }
"entity.item_entities" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/entity/item/EntityItem.java" }
"player.server_authoritative_movement" = { class = "absent", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/Player.java", observed_by = "corrections_per_bot_s", note = "server-auth movement mode, but no CorrectPlayerMovePrediction packets are ever sent" }
"player.physics" = { class = "absent", observed_by = "airborne_frac_steady", note = "bots teleported to y=300 keep hovering" }
"player.hunger_damage" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/PlayerFood.java" }
"player.locator_bar" = { class = "absent", observed_by = "locator_pkts_per_bot_s", note = "the playerwaypoints game rule exists but takes a number" }
"block.redstone" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/block/BlockRedstoneWire.java" }
"block.random_ticks" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/level/Level.java#L1738-L1763", note = "randomtickspeed game rule; chunk-settings.ticking-per-tick (40) caps the chunks ticked per level per tick, so with 100 players each tick covers each player's own chunk and one random chunk within 3 of it" }
"block.fluids" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/block/BlockLiquid.java" }
"block.falling" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/block/BlockFallable.java" }
"world.lighting" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/level/Level.java", note = "chunk-settings.light-updates" }
"world.dimensions" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/Server.java", note = "the Nether and the End are separate levels, loaded at start" }
"world.autosave" = { class = "vanilla", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/Server.java", note = "performance-settings.ticks-per-autosave" }
"commands.vanilla_set" = { class = "partial", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/tree/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/command/defaults", note = "selectors, execute, summon, tickingarea and gamerule from the console; no querytarget or loot" }
"net.encryption" = { class = "vanilla", evidence = "https://github.com/MemoriesOfTime/Nukkit-MOT/blob/9cb0aba49b8b1ac2e53f151f553e6997be8a03e3/src/main/java/cn/nukkit/Server.java", note = "not exercised: benchmarks run offline" }

# Values the harness writes into Nukkit-MOT's config files, one table per override category
# (docs/methodology.md#fairness-and-feature-parity).
#
# The jar ships neither file, so both start empty. Nukkit-MOT adds its own default for every other key and rewrites
# both files on start; `default` gives that built-in value for the keys written here.
[config]

[config.file."server.properties"]
format = "properties"

[config.file."server.properties".harness]
server-port = { value = "{port}", default = "19132", reason = "machine profile port, away from 19132 so a local game cannot collide" }
xbox-auth = { value = "off", default = "on", reason = "the bots log in offline with self-signed identities" }
allow-flight = { value = "on", default = "off", reason = "Nukkit-MOT kicks players it sees hovering, and with no gravity for clients the bots stay at the teleport height" }
"rcon.password" = { value = "", default = "(random, generated on first start)", reason = "no generated secret in the run's archived configs; RCON stays off" }

[config.file."server.properties".parity]
view-distance = { value = "{view_distance}", default = "8", reason = "the same view distance on every server" }
max-players = { value = "{max_players}", default = "50", reason = "room for every bot" }
level-name = { value = "{level_name}", default = "world", reason = "a fixed world folder, checked absent before launch" }
level-seed = { value = "{seed}", default = "", reason = "the same seed on every server; Nukkit-MOT generates its own terrain from it" }
difficulty = { value = "{difficulty_id}", default = "2", reason = "the same difficulty on every server" }
gamemode = { value = "{gamemode_id}", default = "0", reason = "the same game mode on every server" }
auto-save = { value = "on", default = "on", reason = "the world is saved periodically, as on every server" }

[config.file."nukkit-mot.yml"]
format = "yaml"

[config.file."nukkit-mot.yml".harness]
"network-settings.nethernet.enabled" = { value = "false", type = "bool", default = "true", reason = "NetherNet listens on TCP at the server port and on UDP 19132 whatever server-port says; the bots use RakNet" }
"debug-settings.automatic-bug-report" = { value = "false", type = "bool", default = "true", reason = "no error report upload" }
"debug-settings.bstats-metrics" = { value = "false", type = "bool", default = "true", reason = "no usage statistics upload" }
"debug-settings.update-notifications" = { value = "false", type = "bool", default = "true", reason = "no update check when an operator joins" }
"custom-block-settings.auto-download-vanilla-palette" = { value = "false", type = "bool", default = "true", reason = "no download at first start; the palettes are only used with custom blocks" }

[config.file."nukkit-mot.yml".parity]
"performance-settings.auto-tick-rate" = { value = "false", type = "bool", default = "true", reason = "with it, a slow level is ticked only every few server ticks, which the server tick counter does not show" }
"performance-settings.ticks-per-autosave" = { value = "{autosave_ticks}", type = "int", default = "6000", reason = "the same autosave interval on every server" }
"chunk-settings.ticking-radius" = { value = "{tick_distance}", type = "int", default = "3", reason = "the scenario's simulation distance; it only bounds where the capped chunks are picked" }
"player-settings.save-player-data" = { value = "{save_player_data}", type = "bool", default = "true", reason = "player data is saved, as on every server" }
