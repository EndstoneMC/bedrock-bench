# endstone@0.11.14 against the vanilla build it hosts and the previous release, on the spread100 headline
# (client-side generation off).
[matrix]
name = "endstone-0.11.14"
scenarios = ["spread100"]
repeats = 3
order = "rotate"
cooldown_s = 60.0
rerun_invalid = 1
# The priority of the runs behind Endstone's 0.11.14 BENCHMARK.md
# (https://github.com/EndstoneMC/endstone/blob/v0.11.14/BENCHMARK.md).
priority_override = "above_normal"

[[arm]]
server = "bds@1.26.52.3"

[[arm]]
server = "endstone@0.11.13"
bds = "1.26.52.3"
python = "3.13"

[[arm]]
server = "endstone@0.11.14"
bds = "1.26.52.3"
python = "3.13"
