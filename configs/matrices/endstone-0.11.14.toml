# endstone@0.11.14 against the vanilla build it hosts and the previous release, on the spread100 headline
# (client-side generation off). Add "chaos" to scenarios for the robustness runs; chaos adds 15 minutes per run.
[matrix]
name = "endstone-0.11.14"
scenarios = ["spread100"]
repeats = 3
order = "rotate"
cooldown_s = 60.0
rerun_invalid = 1
priority_override = "above_normal"  # as in the legacy runs; recorded in every run

[[arm]]
server = "bds@1.26.52.3"

[[arm]]
server = "endstone@0.11.13"
bds = "1.26.52.3"
python = "3.13"

[[arm]]
server = "endstone@0.11.14"
bds = "1.26.52.3"
python = "3.13"
