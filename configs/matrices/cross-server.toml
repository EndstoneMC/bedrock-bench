# SPDX-License-Identifier: Apache-2.0
# Every server on the spread100 headline: 100 spread bots, client-side generation off, the same scenario, bot flags
# and placement for every arm (docs/methodology.md#fairness-and-feature-parity). Nukkit, Nukkit-MOT and PowerNukkitX
# also run spread100-pregen, which separates chunk delivery from their slow generation; build their templates first with
#   bbench prepare-world nukkit@b3caad6 --scenario spread100-pregen
#   bbench prepare-world nukkitmot@9cb0aba --scenario spread100-pregen
#   bbench prepare-world powernukkitx@3.0.5 --scenario spread100-pregen
#   bbench prepare-world powernukkitx@nightly.86f70bc --scenario spread100-pregen
# Reports group arms by declared fidelity and never rank across groups.
# The PowerNukkitX nightly runs next to 3.0.5 to measure the beta branch. Upstream replaces its jar, so keep a copy.
# Chorus is left out: every run at 95ca835 is invalid, because its player list gives the bots decode errors.
#
# levilamina runs on Windows only; on Linux, pick the other arms with --only.
[matrix]
name = "cross-server"
scenarios = ["spread100", "spread100-pregen"]
repeats = 3
order = "rotate"
cooldown_s = 60.0
rerun_invalid = 1

[[arm]]
server = "bds@1.26.52.3"
scenarios = ["spread100"]

[[arm]]
server = "endstone@0.11.14"
bds = "1.26.52.3"
python = "3.13"
scenarios = ["spread100"]

# Same-build baseline for levilamina@26.51.6.
[[arm]]
server = "bds@1.26.51.1"
scenarios = ["spread100"]

[[arm]]
server = "levilamina@26.51.6"
bds = "1.26.51.1"
scenarios = ["spread100"]

[[arm]]
server = "pocketmine@5.44.3"
scenarios = ["spread100"]

[[arm]]
server = "altay@5.44.7"
scenarios = ["spread100"]

# With its watchdog on, Nukkit may stop itself during the first autosave of a fresh world; that is a result.
[[arm]]
server = "nukkit@b3caad6"

[[arm]]
server = "nukkit@b3caad6"
variant = "no-watchdog"

[[arm]]
server = "nukkitmot@9cb0aba"

[[arm]]
server = "nukkitmot@9cb0aba"
variant = "no-watchdog"

[[arm]]
server = "powernukkitx@3.0.5"

# Runs on JDK 25, 3.0.5 on JDK 21.
[[arm]]
server = "powernukkitx@nightly.86f70bc"

# Protocol 1001 bot and a flat world: flagged bot_protocol_differs and terrain_mismatch.
[[arm]]
server = "allay@0.14.0"
scenarios = ["spread100"]

[[arm]]
server = "dragonfly@1793369"
scenarios = ["spread100"]
