# The legacy BENCHMARK.md comparison: endstone@0.11.14 against the vanilla build it hosts and the previous release,
# with client-side generation on. BDS-hosted servers only, never in a cross-server table
# (docs/methodology.md#client-side-generation-off-in-every-ranking-scenario).
[matrix]
name = "endstone-0.11.14-csg"
scenarios = ["spread100-csg"]
repeats = 3
order = "rotate"
cooldown_s = 60.0
rerun_invalid = 1
priority_override = "above_normal"  # as in the legacy runs; recorded in every run

[[arm]]
server = "bds@1.26.52.3"

[[arm]]
server = "endstone@0.11.13"
bds = "1.26.52.3"
python = "3.13"

[[arm]]
server = "endstone@0.11.14"
bds = "1.26.52.3"
python = "3.13"
