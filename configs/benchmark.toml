# The setup shared by every server.

# Core metrics in report order. metric is the id in docs/metrics.md, stat a key of its distribution value, and
# decimals the digits shown (three significant digits when left out).
[report]
metrics = [
    { column = "tps", metric = "tps_window_steady", title = "TPS", decimals = 2 },
    { column = "tick_cpu_ms_per_tick", metric = "tick_cpu_ms_per_tick_steady", title = "Tick-thread CPU per tick (ms)" },
    { column = "process_cpu_cores", metric = "process_cores_steady", title = "Server CPU (cores)", decimals = 2 },
    { column = "memory_mib", metric = "private_mib_steady", title = "Memory (MiB)", decimals = 0 },
    { column = "view_load_lowest_tps", metric = "tps_load_low5", title = "Lowest TPS while views load", decimals = 2 },
    { column = "view_load_p50_s", metric = "view_t90_own_s", stat = "median", title = "View load time, median player (s)" },
    { column = "view_load_p90_s", metric = "view_t90_own_s", stat = "p90", title = "View load time, p90 player (s)" },
    { column = "view_load_max_s", metric = "view_t90_own_s", stat = "max", title = "View load time, slowest player (s)" },
    { column = "view_load_chunks_per_s", metric = "chunks_per_s_load", title = "Chunks per second while views load" },
    { column = "chunks_in_view_per_player", metric = "chunks_per_bot", stat = "median", title = "Chunks in view per player", decimals = 0 },
]
