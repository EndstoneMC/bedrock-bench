# SPDX-License-Identifier: Apache-2.0
worlds:
  # One world named after the level, in a folder checked absent before launch.
  {{ workload.world.level_name }}:
    # Allay's default storage, written because a world entry has no defaults.
    storage-type: LEVELDB
    # A platform thread, so the world tick has its own OS thread to measure.
    use-virtual-thread: false
    dimensions:
      minecraft:overworld:
        # Allay's default generator, since it has no vanilla terrain generator.
        generator-type: FLAT
        # Allay's default flat layers, written because a world entry has no defaults.
        generator-preset: ''
        # Lighting on, since a missing value turns it off.
        enable-light-calculation: true
# Players join the benchmark world.
default-world: {{ workload.world.level_name }}
