# Dragonfly builds. Dragonfly is a Go library without binary releases: 'bbench fetch dragonfly@<version>' builds the
# dfbench helper from servers/dragonfly, which links the Dragonfly module pinned here. servers/dragonfly/go.mod must
# require the same module version; fetch refuses the build otherwise.
#
# The module is verified twice: Go checks it against servers/dragonfly/go.sum (go_sum below must match), and fetch
# checks the module zip Go downloaded against the sha256 and size of the copy on the Go module proxy.
#
# A build from a commit is tagged with the commit's first seven characters, a release with its version.

server = "dragonfly"
source = "web"

# Latest commit on master when the cross-server runs were set up (2026-09-20).
[version."1793369"]
commit = "1793369709ceed934675d69e86ff6c828e4216c8"

[version."1793369".any]
name = "dragonfly-v0.11.6-0.20260920163020-1793369709ce.zip"
url = "https://proxy.golang.org/github.com/df-mc/dragonfly/@v/v0.11.6-0.20260920163020-1793369709ce.zip"
sha256 = "2168b139b09a7a45f9998c748bf9d929053efb1a5e3af14910c5f0c9e7fbae6e"
size = 1450678
module = "github.com/df-mc/dragonfly"
module_version = "v0.11.6-0.20260920163020-1793369709ce"
